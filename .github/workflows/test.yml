name: test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare immutable shared executor fixture
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: stevekkall-beansgc/qa-kit
          ref: v0.7.0
          path: .qa-fixtures/qa-kit
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Qualify GitHub job workflow identity metadata
        env:
          QUALIFIED_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          QUALIFIED_JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          QUALIFIED_JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          QUALIFIED_JOB_WORKFLOW_PATH: ${{ job.workflow_file_path }}
          QUALIFIED_JOB_CHECK_RUN_ID: ${{ job.check_run_id }}
        run: |
          python3 -I - <<'PY'
          import json, os, re
          values = {key: value for key, value in os.environ.items() if key.startswith('QUALIFIED_JOB_')}
          assert values['QUALIFIED_JOB_WORKFLOW_REPOSITORY'] == 'stevekkall-beansgc/gate-kit'
          assert values['QUALIFIED_JOB_WORKFLOW_PATH'] == '.github/workflows/test.yml'
          assert values['QUALIFIED_JOB_WORKFLOW_REF'].startswith('stevekkall-beansgc/gate-kit/.github/workflows/test.yml@')
          assert re.fullmatch('[0-9a-f]{40}', values['QUALIFIED_JOB_WORKFLOW_SHA'])
          assert re.fullmatch('[1-9][0-9]*', values['QUALIFIED_JOB_CHECK_RUN_ID'])
          print(json.dumps({'job_workflow_metadata': values}))
          PY
      - run: python3 -m unittest discover -s tests -v
      - run: bash setup/qa-validation/bootstrap.sh
      - run: bash scripts/test_validation_e2e.sh
      - run: python3 scripts/check_stdlib.py bin/

  local-validate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'stevekkall-beansgc/gate-kit' && github.event.repository.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, beans-mac]
    timeout-minutes: 30
    steps:
      - name: Verify trusted main push before checkout
        env:
          GATE_EVENT_NAME: ${{ github.event_name }}
          GATE_REPOSITORY: ${{ github.repository }}
          GATE_EVENT_REPOSITORY: ${{ github.event.repository.full_name }}
          GATE_REF: ${{ github.ref }}
          GATE_PUSH_AFTER: ${{ github.event.after }}
          GATE_EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GATE_EVENT_NAME" = push
          test "$GATE_REPOSITORY" = stevekkall-beansgc/gate-kit
          test "$GATE_EVENT_REPOSITORY" = "$GATE_REPOSITORY"
          test "$GATE_REF" = refs/heads/main
          test "$GATE_PUSH_AFTER" = "$GATE_EXPECTED_SHA"
          test "$RUNNER_NAME" = beans-macbook-gate-kit
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
          test -x /opt/homebrew/opt/python@3.12/libexec/bin/python3
          command -v task
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare immutable shared executor fixture
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: stevekkall-beansgc/qa-kit
          ref: v0.7.0
          path: .qa-fixtures/qa-kit
          persist-credentials: false
      - name: Run deterministic Gate Kit checks
        run: |
          set -euo pipefail
          PATH="/opt/homebrew/opt/python@3.12/libexec/bin:$PATH" task validate
