name: gate
on: [pull_request, push]
permissions:
  contents: read
jobs:
  compliance:
    uses: stevekkall-beansgc/gate-kit/.github/workflows/compliance.yml@v0.4.11
    with:
      repo: gate-kit
      full: false
      runner: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && 'beans-mac' || 'ubuntu-latest' }}
