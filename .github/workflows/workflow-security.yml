name: workflow-security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  zizmor:
    continue-on-error: true
    name: zizmor (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out gate-kit workflows
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Scan this repository's workflows
        run: |
          docker run --rm \
            --network none \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            ghcr.io/zizmorcore/zizmor:1.28.0@sha256:8e6b3e4fb74d1aa5d23e83ea369f386c66eced0d1fb944d32cd8b2aac100b00d \
            --persona=regular \
            --no-online-audits \
            --no-exit-codes \
            --color=never \
            -- \
            .github/workflows
