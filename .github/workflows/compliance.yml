# Reusable workflow: deterministic compliance gate (docs + unit [+ e2e]).
# Phase 1 = ADVISORY (Free tier); binding via `ag release --require-pr-green`.
name: compliance-gate
on:
  workflow_call:
    inputs:
      repo:
        required: true
        type: string
      full:
        required: false
        type: boolean
        default: false

jobs:
  compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          path: caller
      # actions/checkout in a called workflow checks out the caller, not this
      # repository. Keep this pinned to the released gate-kit tag so callers
      # cannot silently execute moving control-plane code.
      - uses: actions/checkout@v5
        with:
          repository: stevekkall-beansgc/gate-kit
          ref: v0.4.2
          path: gate-kit
      - uses: actions/checkout@v5
        with:
          repository: stevekkall-beansgc/qa-kit
          ref: v0.3.1
          path: qa-kit
      # BeanFit App's local E2E drives the BeanFit CLI. Keep the fixture
      # immutable so hosted CI never depends on an unpinned sibling branch.
      - uses: actions/checkout@v5
        with:
          repository: stevekkall-beansgc/beanfit
          ref: v0.1.1
          path: beanfit
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run compliance gate
        env:
          QA_KIT_DIR: ${{ github.workspace }}/qa-kit
          BEANFIT_SRC: ${{ github.workspace }}/beanfit/src
          GATE_REPO: ${{ inputs.repo }}
          GATE_FULL: ${{ inputs.full }}
        run: |
          set -o pipefail
          gate_args=(--repo "$GATE_REPO" --root caller --markdown)
          if [[ "$GATE_FULL" == "true" ]]; then
            gate_args+=(--full)
          fi
          python3 gate-kit/bin/compliance.py "${gate_args[@]}" | tee gate-report.md
      - name: Attach summary
        if: always()
        run: cp gate-report.md "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
