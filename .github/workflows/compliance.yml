# Reusable workflow: deterministic compliance gate (docs + unit [+ e2e]).
# Phase 1 = ADVISORY (Free tier); binding via `ag release --require-pr-green`.
name: compliance-gate
on:
  workflow_call:
    inputs:
      repo:
        required: true
        type: string
      full:
        required: false
        type: boolean
        default: false

jobs:
  compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          path: caller
      - uses: actions/checkout@v5
        with:
          repository: stevekkall-beansgc/qa-kit
          path: qa-kit
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run compliance gate
        run: |
          python3 qa-kit/bin/compliance.py --repo "${{ inputs.repo }}" \
            --markdown | tee gate-report.md
      - name: Attach summary
        if: always()
        run: cp gate-report.md "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
